<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edu-LIMS | Thiết lập mật khẩu</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="header-left">
        <div class="header-left-logo">
          <div class="header-left-icon">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div class="header-left-title">Edu-LIMS</div>
        </div>
        <div class="header-left-describe">
          Hệ thống công tác thực hành tin học
        </div>
      </div>
    </header>
    <div class="setup-password-container">
      <div class="setup-password-title">Thiết lập mật khẩu</div>
      <form action="/account/setup" method="post">
        <input type="hidden" name="token" value="{{ token }}" />

        <label for="password">Mật khẩu mới</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          required
        />

        <label for="confirm_password">Xác nhận mật khẩu</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          minlength="8"
          required
        />

        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <button type="submit">Thiết lập mật khẩu</button>
      </form>
    </div>

    <script src="/static/js/auth/setup-password.js"></script>
  </body>
</html>
